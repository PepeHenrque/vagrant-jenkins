name: CI - Build, SAST e DAST

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-pipeline:
    name: Pipeline de segurança
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install - instalar dependências
        working-directory: app
        run: npm ci

      - name: SAST - análise estática com Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: |
            p/javascript
            p/security-audit

      - name: Build
        working-directory: app
        run: npm run build

      - name: Test
        working-directory: app
        run: npm test

      - name: Iniciar aplicação para o DAST
        working-directory: app
        run: |
          nohup npm start > app.log 2>&1 &

          for i in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000; then
              echo "Aplicação iniciada com sucesso"
              exit 0
            fi

            echo "Aguardando a aplicação..."
            sleep 2
          done

          echo "A aplicação não iniciou corretamente"
          cat app.log
          exit 1

      - name: DAST - análise dinâmica com OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://127.0.0.1:3000
          allow_issue_writing: false
          fail_action: false

      - name: Salvar log da aplicação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-log
          path: app/app.log